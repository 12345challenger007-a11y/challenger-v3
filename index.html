<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHALLENGER V3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#f5f6fb}</style>
</head>
<body>
<div id="app"></div>
<script>
const LS={get:(k,d)=>{try{let v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let state={tab:LS.get('c_tab','dashboard'),user:LS.get('c_user','Challenger'),xp:LS.get('c_xp',120),hrs:LS.get('c_hrs',0),logs:LS.get('c_logs',[]),tasks:LS.get('c_tasks',[{id:1,t:'Physics Ch-1 revise',done:false},{id:2,t:'Maths 50 Qs',done:false}]),subjects:LS.get('c_subs',[{n:'Physics',c:'#4a6cf7'},{n:'Chemistry',c:'#10b981'},{n:'Maths',c:'#f59e0b'},{n:'Bio',c:'#ef4444'}]),notes:LS.get('c_notes',[]),videos:LS.get('c_videos',[]),tests:LS.get('c_tests',[]),streak:3,admin:false};
let leaderboard=[{n:'Aarav Singh',xp:2840,l:12,h:68,a:'🔥'},{n:'Priya Sharma',xp:2510,l:11,h:59,a:'⚡'},{n:'Rohan',xp:2190,l:10,h:52,a:'🚀'},{n:'Ishita',xp:1870,l:9,h:44,a:'💎'}];
function save(){LS.set('c_tab',state.tab);LS.set('c_user',state.user);LS.set('c_xp',state.xp);LS.set('c_logs',state.logs);LS.set('c_tasks',state.tasks);LS.set('c_hrs',state.hrs);LS.set('c_subs',state.subjects);LS.set('c_notes',state.notes);LS.set('c_videos',state.videos);LS.set('c_tests',state.tests);}
function toast(m){let d=document.createElement('div');d.className='fixed bottom-24 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full text-sm font-bold z-50';d.innerText=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function addXP(v,msg){state.xp+=v;save();toast(`+${v} XP • ${msg}`);render();}
function render(){const level=Math.floor(state.xp/300)+1;const next=300-(state.xp%300);const pct=(state.xp%300)/3;let all=[...leaderboard,{n:state.user,xp:state.xp,l:level,h:state.hrs,a:'👑',me:1}].sort((a,b)=>b.xp-a.xp);let rank=all.findIndex(u=>u.me)+1;document.getElementById('app').innerHTML=`<div class="flex min-h-screen"><aside class="hidden md:flex w-[260px] bg-white border-r p-6 flex-col fixed h-screen"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-[#4a6cf7] rounded-xl flex items-center justify-center text-white font-extrabold">C</div><div><p class="font-extrabold leading-none">CHALLENGER</p><p class="text-[10px] text-gray-400 font-bold tracking-widest">V3 • ULTIMATE</p></div></div><div class="bg-gradient-to-br from-[#4a6cf7] to-[#6a5af9] rounded-2xl p-4 text-white mt-6"><p class="text-[10px] font-bold opacity-70">LEVEL ${level}</p><p class="font-extrabold">${state.user}</p><div class="w-full bg-white/20 h-2 rounded-full mt-2"><div class="bg-white h-2 rounded-full" style="width:${pct}%"></div></div><p class="text-[10px] mt-2 opacity-80">${state.xp} XP • ${next} to next</p></div><nav class="space-y-1 mt-6">${['dashboard','leaderboard','tracker','pomodoro','tasks','notes','videos','tests','admin'].map(t=>`<button onclick="state.tab='${t}';save();render()" class="w-full text-left px-4 py-2.5 rounded-xl font-bold capitalize text-[13px] ${state.tab===t?'bg-[#4a6cf7] text-white':'text-gray-500 hover:bg-gray-50'}">${t}</button>`).join('')}</nav><div class="mt-auto text-[11px] font-bold text-gray-400">🔥 ${state.streak} DAY STREAK • ${state.hrs.toFixed(1)}h TOTAL</div></aside><main class="flex-1 md:ml-[260px]"><div class="md:hidden sticky top-0 bg-white border-b p-4 flex justify-between z-20"><span class="font-extrabold">CHALLENGER V3</span><span class="bg-[#4a6cf7] text-white px-3 py-1 rounded-full text-xs font-bold">Lv ${level} • ${state.xp} XP</span></div><div class="p-4 md:p-8">${getTab(level,rank,all)}</div></main></div>`;if(state.tab==='pomodoro')initPomo();if(state.tab==='admin'&&state.admin)renderQBuilder();}
function getTab(level,rank,all){if(state.tab==='dashboard'){let today=state.logs.filter(l=>new Date(l.d).toDateString()===new Date().toDateString());let th=today.reduce((s,l)=>s+l.h,0);return `<h1 class="text-3xl font-extrabold">Hey ${state.user}! 👋</h1><p class="text-gray-500 text-sm">Zero se start, full power!</p><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"><div class="bg-white border rounded-2xl p-5"><p class="text-[10px] font-bold text-gray-400">TODAY</p><p class="text-3xl font-extrabold">${th.toFixed(1)}h</p></div><div class="bg-white border rounded-2xl p-5"><p class="text-[10px] font-bold text-gray-400">TOTAL XP</p><p class="text-3xl font-extrabold">${state.xp}</p><p class="text-xs">Level ${level}</p></div><div class="bg-white border rounded-2xl p-5"><p class="text-[10px] font-bold text-gray-400">TASKS</p><p class="text-3xl font-extrabold">${state.tasks.filter(t=>t.done).length}/${state.tasks.length}</p></div><div class="bg-[#4a6cf7] text-white rounded-2xl p-5"><p class="text-[10px] font-bold opacity-70">RANK</p><p class="text-3xl font-extrabold">#${rank}</p></div></div><div class="bg-white border rounded-2xl p-6 mt-6"><h3 class="font-bold">Add Study + Get XP (100 XP / hour)</h3><div class="flex gap-2 mt-4"><select id="qs" class="border rounded-xl p-3 flex-1 font-bold">${state.subjects.map(s=>`<option>${s.n}</option>`).join('')}</select><input id="qh" type="number" value="1" step="0.5" class="border rounded-xl p-3 w-24"><button onclick="addLog()" class="bg-[#4a6cf7] text-white px-6 rounded-xl font-bold">Add +XP</button></div></div>`;}
if(state.tab==='leaderboard'){return `<div class="flex justify-between items-center"><h1 class="text-2xl font-extrabold">🏆 Leaderboard - Live</h1><button onclick="let n=prompt('Your name?',state.user);if(n){state.user=n;save();render()}" class="bg-gray-100 px-4 py-2 rounded-full text-xs font-bold">Edit Name</button></div><div class="bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl p-6 text-white mt-6 flex justify-between items-center"><div><p class="text-xs font-bold opacity-80">YOUR RANK</p><p class="text-4xl font-extrabold">#${rank}</p><p class="text-sm">${state.xp} XP • Level ${level}</p></div><div class="text-5xl">👑</div></div><div class="bg-white border rounded-2xl mt-6 overflow-hidden">${all.map((u,i)=>`<div class="flex items-center gap-4 p-4 border-b ${u.me?'bg-[#f0f2ff]':''}"><div class="w-8 h-8 rounded-full flex items-center justify-center font-extrabold text-xs ${i==0?'bg-yellow-400 text-white':i==1?'bg-gray-300':i==2?'bg-orange-400 text-white':'bg-gray-100'}">${i+1}</div><div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-xl">${u.a}</div><div class="flex-1"><p class="font-bold text-sm ${u.me?'text-[#4a6cf7]':''}">${u.n} ${u.me?'(You)':''}</p><p class="text-[11px] text-gray-500">Lv ${u.l} • ${u.h}h</p></div><b class="text-sm">${u.xp} XP</b></div>`).join('')}</div>`;}
if(state.tab==='tracker'){return `<h1 class="text-2xl font-extrabold">📈 Tracker</h1><div class="bg-white border rounded-2xl p-4 mt-4">${state.logs.length?state.logs.slice().reverse().map(l=>`<div class="flex justify-between bg-gray-50 p-3 rounded-xl mb-2"><div><b class="text-sm">${l.s}</b><p class="text-[11px] text-gray-500">${new Date(l.d).toLocaleString()}</p></div><div class="text-right"><b class="text-sm">${l.h}h</b><p class="text-xs text-[#4a6cf7] font-bold">+${l.h*100} XP</p></div></div>`).join(''):'<p class="text-center py-10 text-gray-400 text-sm">No logs yet</p>'}</div>`}
if(state.tab==='tasks'){return `<h1 class="text-2xl font-extrabold">✅ Tasks (50 XP each)</h1><div class="bg-white border rounded-2xl p-4 mt-4 flex gap-2"><input id="tt" placeholder="New task..." class="flex-1 border rounded-full px-5 py-3 text-sm"><button onclick="addTask()" class="bg-[#4a6cf7] text-white px-6 rounded-full font-bold text-sm">Add</button></div><div class="space-y-2 mt-4">${state.tasks.map(t=>`<div class="bg-white border rounded-2xl p-4 flex justify-between items-center"><label class="flex gap-3 items-center"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><span class="font-bold text-sm ${t.done?'line-through text-gray-400':''}">${t.t}</span></label><button onclick="delTask(${t.id})" class="text-gray-400">✕</button></div>`).join('')}</div>`}
if(state.tab==='pomodoro'){return `<div class="max-w-md mx-auto text-center mt-10"><p class="text-[11px] font-bold text-gray-400 tracking-widest">40 XP PER FOCUS SESSION</p><h1 id="pt" class="text-7xl font-extrabold mt-6">25:00</h1><div class="flex justify-center gap-3 mt-8"><button onclick="togglePomo()" id="pb" class="bg-[#4a6cf7] text-white px-10 py-4 rounded-full font-bold">Start Focus</button><button onclick="resetPomo()" class="bg-gray-100 px-6 py-4 rounded-full font-bold">Reset</button></div></div>`}
if(state.tab==='admin'){if(!state.admin){return `<div class="max-w-md mx-auto bg-white border rounded-2xl p-8 mt-10 text-center"><h2 class="font-extrabold text-2xl">ADMIN STUDIO 🔐</h2><p class="text-xs text-gray-500 mt-2">Password: admin05018</p><input id="ap" type="password" placeholder="Enter password" class="w-full border rounded-full px-5 py-3 mt-6 text-sm"><button onclick="if(document.getElementById('ap').value==='admin05018'){state.admin=true;render()}else alert('Wrong')" class="w-full bg-[#4a6cf7] text-white py-3 rounded-full font-bold mt-3 text-sm">Unlock</button></div>`}return `<h1 class="text-2xl font-extrabold">Admin Studio</h1><div class="bg-white border rounded-2xl p-5 mt-6"><h3 class="font-bold text-sm">Add Test + Question Builder (FIXED)</h3><input id="ttitle" placeholder="Test Title" class="w-full border rounded-xl p-3 mt-3 text-sm"><div class="flex gap-2 mt-2"><input id="tsub" placeholder="Subject" class="flex-1 border rounded-xl p-3 text-sm"><input id="tdur" type="number" value="30" class="w-24 border rounded-xl p-3 text-sm"></div><div id="qbuilder" class="mt-4 space-y-3"></div><button onclick="addQField()" class="w-full bg-gray-100 py-2.5 rounded-full font-bold text-sm mt-2">+ Add Question</button><button onclick="publishTest()" class="w-full bg-[#4a6cf7] text-white py-3 rounded-full font-bold mt-3 text-sm">Publish Test 🚀</button></div><button onclick="state.admin=false;render()" class="mt-6 bg-gray-100 px-4 py-2 rounded-full font-bold text-xs">Logout</button>`;}
return `<h1 class="text-2xl font-extrabold">${state.tab}</h1><p class="text-gray-400 mt-4">Coming soon - Admin se add hoga</p>`;}
function addLog(){let s=document.getElementById('qs').value;let h=parseFloat(document.getElementById('qh').value)||1;state.logs.push({s,h,d:Date.now()});state.hrs+=h;save();addXP(h*100,`${h}h ${s}`);}
function addTask(){let t=document.getElementById('tt').value.trim();if(!t)return;state.tasks.push({id:Date.now(),t,done:false});save();render();}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(!t.done){t.done=true;addXP(50,`Task: ${t.t}`)}else{t.done=false;state.xp=Math.max(0,state.xp-50);save();render();}}
function delTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render();}
let qTemp=[];function addQField(){qTemp.push({q:'',o:['','','',''],a:0});renderQBuilder();}
function renderQBuilder(){let el=document.getElementById('qbuilder');if(!el)return;el.innerHTML=qTemp.map((qq,i)=>`<div class="border rounded-xl p-3 bg-gray-50"><input placeholder="Q${i+1} - Question likho" value="${qq.q}" oninput="qTemp[${i}].q=this.value" class="w-full border rounded-lg p-2.5 font-bold text-sm"><div class="grid grid-cols-2 gap-2 mt-2">${qq.o.map((oo,j)=>`<input placeholder="Option ${String.fromCharCode(65+j)}" value="${oo}" oninput="qTemp[${i}].o[${j}]=this.value" class="border rounded-lg p-2 text-sm ${qq.a===j?'bg-green-50 border-green-500':''}">`).join('')}</div><div class="flex gap-1 mt-2">${[0,1,2,3].map(j=>`<button onclick="qTemp[${i}].a=${j};renderQBuilder()" class="px-3 py-1 rounded-full text-[11px] font-bold ${qq.a===j?'bg-green-600 text-white':'bg-white border'}">Correct: ${String.fromCharCode(65+j)}</button>`).join('')}<button onclick="qTemp.splice(${i},1);renderQBuilder()" class="ml-auto px-3 py-1 rounded-full text-[11px] font-bold bg-red-100 text-red-600">Delete</button></div></div>`).join('');}
function publishTest(){let title=document.getElementById('ttitle').value.trim();let sub=document.getElementById('tsub').value.trim()||'General';let dur=parseInt(document.getElementById('tdur').value)||30;if(!title||qTemp.length===0){alert('Title + 1 question chahiye');return;}state.tests.push({id:Date.now(),title,sub,dur,qs:JSON.parse(JSON.stringify(qTemp))});qTemp=[];save();render();toast('Test Published!');}
function startTest(id){let t=state.tests.find(x=>x.id===id);let s=0,cur=0;function ask(){if(cur>=t.qs.length){alert(`Score: ${s}/${t.qs.length}`);addXP(s*10,`Test: ${t.title}`);return;}let qq=t.qs[cur];let ans=prompt(`Q${cur+1}: ${qq.q}\nA:${qq.o[0]}\nB:${qq.o[1]}\nC:${qq.o[2]}\nD:${qq.o[3]}\nEnter A/B/C/D`);let map={A:0,B:1,C:2,D:3,a:0,b:1,c:2,d:3};if(map[ans]===qq.a)s++;cur++;ask();}ask();}
let pomo={active:false,sec:25*60,timer:null};function togglePomo(){pomo.active=!pomo.active;let b=document.getElementById('pb');if(b)b.innerText=pomo.active?'Pause':'Start Focus';initPomo();}function resetPomo(){clearInterval(pomo.timer);pomo.active=false;pomo.sec=25*60;render();}function initPomo(){if(pomo.timer)clearInterval(pomo.timer);if(!pomo.active)return;pomo.timer=setInterval(()=>{pomo.sec--;let el=document.getElementById('pt');if(el){let m=Math.floor(pomo.sec/60).toString().padStart(2,'0');let s=(pomo.sec%60).toString().padStart(2,'0');el.innerText=`${m}:${s}`}if(pomo.sec<=0){clearInterval(pomo.timer);pomo.active=false;state.logs.push({s:'Focus',h:0.42,d:Date.now()});state.hrs+=0.42;save();addXP(40,'Pomodoro Done');pomo.sec=25*60;render();}},1000);}
render();
</script>
</body>
</html>
